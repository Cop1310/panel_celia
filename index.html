<script>

 {d:T, i:'22:00',f:'07:30',t:'A DORMIR',s:'Hasta las 7:30 no te levantes',ic:'😴'},

];
/* Festivos (nacionales + Comunidad de Madrid + Madrid capital). Revisar cada año en ajustes.html. */
window.FESTIVOS_DEF=['2026-12-07','2026-12-08','2026-12-25',
 '2027-01-01','2027-01-06','2027-03-19','2027-03-25','2027-03-26','2027-05-01','2027-05-15','2027-08-16','2027-10-12','2027-11-01','2027-11-09','2027-12-06','2027-12-08','2027-12-25'];

<script>
(function(){
var VERSION='2.0';
/* ---- ajustes fáciles de cambiar ---- */
var NOCHE_INI=22*60;          /* 22:00 empieza la noche */
var NOCHE_FIN=7*60+30;        /* 7:30 acaba la noche */
var MSG_VIDA=10*60*1000;      /* los mensajes duran 10 minutos */
var TOQUE_MIN=5;              /* minutos sin máscara tras tocar la pantalla */
var MSG_NUEVO_MIN=10;         /* minutos sin máscara tras un mensaje nuevo */
var MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

function $(id){return document.getElementById(id)}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
var agenda=null,msgs=[],lastOk=0,lastTick='',flashTimer=null,flashDismissed=0,aviso=null,alerta=null,fails=0,rec=null,maskOffUntil=0,borrados={};
try{agenda=JSON.parse(ls('pc_agenda')||'null')}catch(e){}
if(!agenda||!agenda.sem)agenda=PC.DEF();
try{msgs=JSON.parse(ls('pc_msgs')||'[]')}catch(e){msgs=[]}
try{aviso=JSON.parse(ls('pc_aviso')||'null')}catch(e){aviso=null}
try{rec=JSON.parse(ls('pc_rec')||'null')}catch(e){rec=null}

function place(id,x,y,w,h){var e=$(id);e.style.left=Math.round(x)+'px';e.style.top=Math.round(y)+'px';e.style.width=Math.round(w)+'px';e.style.height=Math.round(h)+'px'}
function setFs(id,px){$(id).style.fontSize=Math.round(px)+'px'}
function fitText(box,maxPx,minPx){
  var s=maxPx;box.style.fontSize=Math.round(s)+'px';
  while(box.scrollHeight>box.clientHeight+1&&s>minPx){s-=2;box.style.fontSize=Math.round(s)+'px'}
}
var L={};
function calcChat(){return !!(PC.configurado()&&msgs.filter(vivo).length>0)}
function layout(){
  var W=window.innerWidth,H=window.innerHeight,land=W>H*1.1,m=Math.round(Math.min(W,H)*0.02);
  var hc=calcChat();L.hayChat=hc;
  L.W=W;L.H=H;L.land=land;
  var bx,by,bw,bh,hx,hy,hw,hh,ax,ay,aw,ah,cx,cy,cw,ch;
  if(!land){
    bx=m;bw=W-2*m;hx=m;hw=bw;ax=m;aw=bw;cx=m;cw=bw;
    if(hc){by=m;bh=H*0.20;hy=by+bh;hh=H*0.15;ay=hy+hh+m;ah=H*0.36;cy=ay+ah+m;ch=H-cy-m}
    else{by=m;bh=H*0.19;hy=by+bh;hh=H*0.15;ay=hy+hh+m;ah=H-ay-m;cy=0;ch=0}
  }else{
    var lw=hc?W*0.56:W;
    bx=m;bw=hc?lw-m:W-2*m;hx=m;hw=bw;ax=m;aw=bw;
    by=m;bh=H*0.29;hy=by+bh;hh=H*0.24;ay=hy+hh+m;ah=H-ay-m;
    cx=lw+m;cw=W-cx-m;cy=m;ch=H-2*m;
  }
  $('chat').style.display=hc?'block':'none';
  place('bdia',bx,by,bw,bh);place('bhora',hx,hy,hw,hh);place('ahora',ax,ay,aw,ah);place('chat',cx,cy,cw,ch);
  /* día de la semana, fecha grande y línea de recordatorio */
  setFs('dia',Math.min(bh*0.27,bw*0.15));
  setFs('fl',Math.min(bh*0.36,bw*0.105));
  L.recFs=Math.min(bh*0.20,bw*0.06);
  $('rec').style.height=Math.round(bh*0.22)+'px';
  setFs('hm',Math.min(hh*0.70,hw*0.34));setFs('per',Math.min(hh*0.22,hw*0.07));
  render();
}
/* color del fondo: verde 7:30-9:00 · amarillo 9:00-21:00 · rojo 21:00-7:30 */
function tema(d){var mm=d.getHours()*60+d.getMinutes();if(mm>=21*60||mm<7*60+30)return 'noche';if(mm<9*60)return 'dia';return 'tarde'}
function esNoche(d){var mm=d.getHours()*60+d.getMinutes();return mm>=NOCHE_INI||mm<NOCHE_FIN}
function minOf(s){var p=String(s).split(':'),h=parseInt(p[0],10),mi=parseInt(p[1]||'0',10);if(isNaN(h)||isNaN(mi))return null;return h*60+mi}
function fmtDur(min){
  min=Math.ceil(min);
  if(min<1)return 'menos de 1 min';
  var h=Math.floor(min/60),mi=min%60;
  if(h===0)return mi+' min';
  if(mi===0)return h+' h';
  return h+' h '+mi+' min';
}
/* ---- rutina (por defecto rutina.js; la familia la puede cambiar en ajustes.html → Firebase 'rutina' y 'festivos') ---- */
var rutina=null,festivos=null;
try{rutina=JSON.parse(ls('pc_rutina')||'null')}catch(e){}
try{festivos=JSON.parse(ls('pc_festivos')||'null')}catch(e){}
function arr(x){if(!x)return [];if(x.length!==undefined&&typeof x!=='string')return Array.prototype.slice.call(x);var r=[];for(var k in x)if(x.hasOwnProperty(k))r.push(x[k]);return r}
function bloques(){var r=arr(rutina);return r.length?r:window.RUTINA_DEF}
function esFestivo(d){var k=PC.iso(d),l=window.FESTIVOS_DEF.concat(arr(festivos));for(var i=0;i<l.length;i++)if(l[i]===k)return true;return false}
function diaEf(d){var w=d.getDay();return esFestivo(d)?(w===0?0:6):w}
/* segmentos en minutos desde las 0:00 de hoy (ayer, hoy, mañana y pasado) */
function segmentos(now){
  var out=[],bl=bloques();
  for(var k=-1;k<=2;k++){
    var dd=new Date(now.getFullYear(),now.getMonth(),now.getDate()+k,12,0,0),ef=diaEf(dd);
    for(var j=0;j<bl.length;j++){
      var b=bl[j],ds=arr(b.d),ok=false;
      for(var q=0;q<ds.length;q++)if(Number(ds[q])===ef)ok=true;
      if(!ok)continue;
      var i=minOf(b.i),f=minOf(b.f);if(i===null||f===null)continue;
      var len=f-i;if(len<=0)len+=1440;
      out.push({a:k*1440+i,z:k*1440+i+len,b:b});
    }
  }
  return out;
}
function situacion(now){
  var m=now.getHours()*60+now.getMinutes()+now.getSeconds()/60,sg=segmentos(now),cur=null,nx=null,i;
  for(i=0;i<sg.length;i++)if(sg[i].a<=m&&m<sg[i].z&&(!cur||sg[i].a>cur.a))cur=sg[i];
  var pe=null;
  for(i=0;i<sg.length;i++){
    var x=sg[i];
    if(x.a>m&&(!cur||x.a>=cur.z)&&(!nx||x.a<nx.a))nx=x;
    if(x.z<=m&&(pe===null||x.z>pe))pe=x.z;
  }
  return {m:m,cur:cur,next:nx,prevEnd:pe};
}

/* hora de salida del sol en Madrid (fórmula NOAA), en minutos locales del día de d */
function amanecerMin(d){
  var lat=40.4168,lon=-3.7038,rad=Math.PI/180;
  var y=d.getFullYear(),m=d.getMonth(),dd=d.getDate();
  var N=Math.round((Date.UTC(y,m,dd)-Date.UTC(y,0,0))/86400000);
  var g=2*Math.PI/365*(N-1+(12-12)/24);
  var eq=229.18*(0.000075+0.001868*Math.cos(g)-0.032077*Math.sin(g)-0.014615*Math.cos(2*g)-0.040849*Math.sin(2*g));
  var dec=0.006918-0.399912*Math.cos(g)+0.070257*Math.sin(g)-0.006758*Math.cos(2*g)+0.000907*Math.sin(2*g)-0.002697*Math.cos(3*g)+0.00148*Math.sin(3*g);
  var ha=Math.acos(Math.cos(90.833*rad)/(Math.cos(lat*rad)*Math.cos(dec))-Math.tan(lat*rad)*Math.tan(dec))/rad;
  var utc=720-4*(lon+ha)-eq;
  var off=-new Date(y,m,dd,12).getTimezoneOffset();
  return Math.round(utc+off);
}
function durTxt(min){
  min=Math.ceil(min);
  if(min<=1)return 'menos de 1 minuto';
  if(min<60)return min+' minutos';
  var h=Math.floor(min/60),r=min%60,y='';
  if(r>=45)h+=1;else if(r>=15)y=' y media';
  return (h===1?'1 hora':h+' horas')+y;
}
function faltaTxt(min,para){
  var t=durTxt(min),sing=/^(1 hora|menos|1 minuto)/.test(t);
  return (sing?'Falta ':'Faltan ')+t+' '+para;
}
function horaTxt(am){var h=Math.floor(am/60)%24,mi=am%60;return PC.h12(h)+':'+PC.pad(mi)+' '+PC.periodo(h)}
/* mensaje de espera en los ratos libres (sin contador): texto grande, hora clave en rojo */
function esperaTxt(nx,d){
  var h=Math.floor(nx.a/60)%24,mi=nx.a%60,h12=PC.h12(h);
  var hora=PC.h12(h)+':'+PC.pad(mi),art=(h12===1?'LA ':'LAS ');
  var col=tema(d)==='noche'?'#FF8A80':'#C62828';
  var R=function(t){return '<span style="color:'+col+'">'+t+'</span>'};
  var n=String(nx.b.t||'').toUpperCase(),fin;
  if(n==='CENAR')return 'PARA CENAR ESPERA '+R('HASTA '+art+hora)+' PARA QUE NO SE TE HAGA MUY LARGA LA NOCHE';
  if(n==='COMER')return 'PARA COMER ESPERA '+R('HASTA '+art+hora)+' PORQUE TODAVÍA ES PRONTO';
  if(n==='IR A MISA')return 'ESPERA '+R('HASTA '+art+hora)+' PARA IR A MISA PORQUE AÚN NO HA ABIERTO LA IGLESIA DE SAN MATEO';
  return 'A CONTINUACIÓN: '+esc(nx.b.t)+' '+R('A '+art+hora);
}
function renderAhora(){
  var d=new Date(),S=situacion(d),cur=S.cur,nx=S.next,av=(aviso&&aviso.texto)?aviso:null;
  var centro=!!(cur&&cur.b.c)&&!av;
  var sinAct=!cur&&!av;
  var espera=sinAct&&!!nx;
  var noch=!!(cur&&minOf(cur.b.i)>minOf(cur.b.f));
  var conBarra=!av&&!!cur&&(centro||noch||!!(nx&&nx.b.c));
  document.body.className=tema(d);
  var box=$('ahora'),ah=box.clientHeight,aw=box.clientWidth,land=L.land;
  $('ahora').className=av?'blk av':'blk';
  var z=L.hayChat?1:1.3;
  var t0=$('t0'),ico=$('aico'),tx=$('atxt'),c=$('cuenta'),b=$('barra'),bi=$('barraI'),sub=$('desp'),row=$('brow'),bo=$('bola'),i0=$('bi0'),i1=$('bi1');
  /* cuenta atrás y barra */
  var cuentaTxt='',prog=null,left='',right='';
  if(conBarra){
    var endT=centro?cur.z:nx.a,para=centro?'para volver a casa':(nx.b.c?'para ir al centro de día':'para '+esc(nx.b.t));
    var start=cur?cur.a:(S.prevEnd!==null?S.prevEnd:endT-240);
    cuentaTxt=faltaTxt(endT-S.m,para);
    var tot=endT-start;if(tot>0){prog=(S.m-start)/tot;prog=Math.max(0,Math.min(1,prog))}
    left=cur.b.ic||'';
    right=centro?'🏠':(nx?(nx.b.ic||''):'');
  }
  t0.innerHTML=av?'AVISO':'AHORA';
  t0.style.display=(sinAct||centro)?'none':'block';
  t0.style.fontSize=Math.round(Math.min(ah*0.07,aw*0.04)*z)+'px';
  ico.innerHTML=av?esc(av.icono||''):(espera?(nx.b.ic||''):(sinAct?'':(cur.b.ic||'')));
  ico.style.display=ico.innerHTML?'block':'none';
  ico.style.fontSize=Math.round(Math.min(ah*(centro?0.20:(espera?0.12:0.15))*z,aw*0.2))+'px';
  tx.style.lineHeight=espera?'1.12':'';
  tx.innerHTML=av?esc(av.texto):(centro?'HOY HAY CENTRO DE DÍA':(espera?esperaTxt(nx,d):(cur?esc(cur.b.t):'')));
  tx.style.display=(sinAct&&!espera)?'none':'block';
  var subT=(!av&&centro)?('Hasta las '+horaTxt(cur.z)):((!av&&cur&&cur.b.s)?esc(cur.b.s):'');
  sub.innerHTML=subT;sub.style.display=subT?'block':'none';
  sub.style.fontSize=Math.round(Math.min(ah*0.055*z,aw*0.04))+'px';
  c.innerHTML=cuentaTxt;
  c.style.fontSize=Math.round(Math.min(ah*(sinAct?0.18:0.095)*z,aw*(sinAct?0.1:0.065)))+'px';
  c.style.display=cuentaTxt?'block':'none';
  if(prog===null){row.style.display='none'}
  else{
    var bh=Math.max(14,Math.round(ah*0.06*z)),fi=Math.round(Math.min(ah*(sinAct?0.16:0.11)*z,aw*0.13));
    row.style.display='flex';
    b.style.height=bh+'px';
    bo.style.width=bo.style.height=Math.round(bh*1.9)+'px';
    bi.style.width=Math.round(prog*100)+'%';
    bo.style.left=Math.round(prog*100)+'%';
    i0.innerHTML=left;i1.innerHTML=right;i0.style.fontSize=i1.style.fontSize=fi+'px';
  }
  /* ajustar el texto de la actividad al hueco libre */
  var libre=ah-((sinAct||centro)?0:t0.offsetHeight)-(ico.style.display==='none'?0:ico.offsetHeight)-(sub.style.display==='none'?0:sub.offsetHeight)-(c.style.display==='none'?0:c.offsetHeight)-(row.style.display==='none'?0:row.offsetHeight+10)-Math.round(L.H*0.05)-6;
  if(!sinAct||espera){
    var s=espera?aw*0.14:Math.min(ah*0.22*z,aw*0.13);tx.style.fontSize=Math.round(s)+'px';
    var g=0;while(tx.offsetHeight>libre&&s>14&&g++<80){s-=2;tx.style.fontSize=Math.round(s)+'px'}
  }else{
    var s2=parseInt(c.style.fontSize,10),g2=0;
    while(c.offsetHeight>ah-row.offsetHeight-30&&s2>14&&g2++<60){s2-=2;c.style.fontSize=s2+'px'}
  }
  var sol=$('sol'),tm=tema(d),hh=d.getHours();
  if(tm==='noche'&&!av&&noch){
    var dia=(hh>=21)?new Date(d.getFullYear(),d.getMonth(),d.getDate()+1,12):d;
    var am=amanecerMin(dia);
    sol.innerHTML='🌅 '+(hh>=21?'Mañana':'Hoy')+' amanece a las '+PC.h12(Math.floor(am/60))+':'+PC.pad(am%60);
    sol.style.fontSize=Math.round(Math.min(ah*0.07*z,aw*0.045))+'px';sol.style.display='block';
  }else sol.style.display='none';
  applyMask();
}
function renderFecha(){

/* línea que rellena la familia debajo de la fecha (ej. "Cumpleaños de Emma") */
function renderRec(){

  var s=L.recFs||20;e.style.fontSize=Math.round(s)+'px';
  var g=0;while(e.scrollWidth>e.clientWidth+1&&s>14&&g++<60){s-=2;e.style.fontSize=Math.round(s)+'px'}
}
function quienDia(ts){
  var d=new Date(ts),n=new Date(),a=PC.iso(d),b=PC.iso(n);
  if(a===b)return '';
  var y=new Date(n.getFullYear(),n.getMonth(),n.getDate()-1,12,0);
  if(a===PC.iso(y))return 'ayer, ';
  return PC.DIAS[d.getDay()]+' '+d.getDate()+', ';
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var popId=null,popUntil=0,popShown=null,seen=[],seenInit=false;
try{var sv=JSON.parse(ls('pc_seen')||'null');if(sv&&sv.length!==undefined){seen=sv;seenInit=true}}catch(e){}
function popDur(m){return Math.min(25,10+Math.floor(String(m.texto).length/10))*1000}
function detectaNuevos(list){
  var l=list.slice().sort(function(a,b){return a.ts-b.ts}),i,nuevo=null;
  if(!seenInit){for(i=0;i<l.length;i++)seen.push(l[i].id);seenInit=true}
  else for(i=0;i<l.length;i++)if(seen.indexOf(l[i].id)<0){seen.push(l[i].id);nuevo=l[i]}
  if(seen.length>60)seen=seen.slice(seen.length-60);
  ls('pc_seen',JSON.stringify(seen));
  if(nuevo){popId=nuevo.id;popUntil=Date.now()+popDur(nuevo);popShown=null}
}
function renderPop(){
  var p=$('pop'),m=null,i;
  if(popId&&Date.now()<popUntil)for(i=0;i<msgs.length;i++)if(msgs[i].id===popId)m=msgs[i];
  if(!m){p.style.display='none';popShown=null;return}
  p.style.display='block';
  if(popShown===popId)return;
  popShown=popId;
  var W=L.W,H=L.H,mn=Math.min(W,H),de=$('popde'),tx=$('poptx');
  de.innerHTML='📩 Mensaje de '+esc(m.de||'la familia');de.style.fontSize=Math.round(mn*0.065)+'px';
  tx.innerHTML=esc(m.texto);
  var fs=mn*0.16,g=0;tx.style.fontSize=Math.round(fs)+'px';
  while((tx.offsetHeight+de.offsetHeight)>(H-mn*0.1)&&fs>18&&g++<80){fs-=2;tx.style.fontSize=Math.round(fs)+'px'}
}
$('pop').onclick=function(){popUntil=0;renderPop()};
function vivo(m){return (Date.now()-m.ts)<MSG_VIDA}
function renderMsgs(){
  if(calcChat()!==L.hayChat){layout();return}
  var box=$('msgs'),W=L.W,H=L.H,ch=$('chat').clientHeight,cw=$('chat').clientWidth;
  var ct=$('ct');ct.style.fontSize=Math.round(Math.min(ch*0.06,cw*0.055))+'px';
  var avail=ch-ct.offsetHeight-Math.min(W,H)*0.05;
  box.style.height=Math.max(40,avail)+'px';
  if(!PC.configurado()){box.innerHTML='';return}
  var L2=msgs.filter(vivo).sort(function(a,b){return b.ts-a.ts});
  if(!L2.length){box.innerHTML='';return}
  var base=Math.min(ch*0.11,cw*0.075),fs=base,out,k,n=Math.min(L2.length,8);
  function build(count,f){
    var h='',i,m,nuevo;
    for(i=0;i<count;i++){
      m=L2[i];nuevo=(Date.now()-m.ts)<10*60*1000;
      var d=new Date(m.ts),hh=PC.hm12(PC.pad(d.getHours())+':'+PC.pad(d.getMinutes()))+' '+PC.periodo(d.getHours());
      h+='<div class="m'+(nuevo?' nuevo':'')+'"><div class="de" style="font-size:'+Math.round(f*0.62)+'px">'+esc(m.de)+' · '+quienDia(m.ts)+hh+'</div><div class="tx" style="font-size:'+Math.round(f)+'px">'+esc(m.texto)+'</div></div>';
    }
    return h;
  }
  /* primero reducir letra, luego quitar los más antiguos */
  while(n>=1){
    fs=base;
    while(true){
      box.innerHTML=build(n,fs);
      if(box.scrollHeight<=box.clientHeight+1||fs<=Math.max(16,base*0.55))break;
      fs-=2;
    }
    if(box.scrollHeight<=box.clientHeight+1)break;
    n--;
  }
  if(n<1){box.innerHTML=build(1,Math.max(16,base*0.55))}
}
function renderEstado(){
  var e=$('estado');
  if(!PC.configurado()){e.innerHTML='';return}
  var down=(Date.now()-lastOk)>25000&&fails>=2;
  e.innerHTML=down?'Sin conexión':'';
  e.style.fontSize=Math.round(Math.min(L.W,L.H)*0.026)+'px';
}
function render(){renderFecha();renderRec();renderAhora();renderMsgs();renderEstado()}

/* ---- máscara de noche (brillo bajo simulado) ----
   Solo de 22:00 a 7:30. Se quita si hay mensaje nuevo, aviso, parpadeo,
   o durante unos minutos al tocar la pantalla. */
function hayMsgNuevo(){
  var i;
  for(i=0;i<msgs.length;i++)if((Date.now()-msgs[i].ts)<MSG_NUEVO_MIN*60*1000)return true;
  return false;
}
function applyMask(){
  var quitar=(Date.now()<maskOffUntil)||!!(aviso&&aviso.texto)||alertaActiva()||hayMsgNuevo();
  $('mask').style.display=(esNoche(new Date())&&!quitar)?'block':'none';
}
function toque(){maskOffUntil=Date.now()+TOQUE_MIN*60*1000;applyMask()}
document.addEventListener('touchstart',toque,false);
document.addEventListener('click',toque,false);

/* ---- parpadeo (solo cuando la familia lo activa) ---- */
function flashTexto(){
  var m=null,i;
  if(aviso&&aviso.texto)return {d:'Aviso de '+esc(aviso.de||''),t:esc(aviso.texto)};
  for(i=0;i<msgs.length;i++)if(!m||msgs[i].ts>m.ts)m=msgs[i];
  if(m&&(Date.now()-m.ts)<30*60*1000)return {d:'Mensaje de '+esc(m.de),t:esc(m.texto)};
  return {d:'',t:'Mira la pantalla'};
}
function startFlash(){
  var f=$('flash'),c=flashTexto();
  $('fd').innerHTML=c.d;$('ft').innerHTML=c.t;
  var u=Math.min(L.W,L.H);
  $('fd').style.fontSize=Math.round(u*0.07)+'px';
  var s=u*0.10;$('ft').style.fontSize=Math.round(s)+'px';
  f.style.display='block';f.className='a';
  var guard=0;while($('ft').scrollHeight+$('fd').offsetHeight>L.H*0.78&&s>18&&guard++<60){s-=3;$('ft').style.fontSize=Math.round(s)+'px'}
  if(flashTimer)clearInterval(flashTimer);
  var t=0;
  flashTimer=setInterval(function(){
    t++;f.className=(t%2)?'b':'a';
    if(!alertaActiva())stopFlash();
  },700);
}
function stopFlash(){
  if(flashTimer){clearInterval(flashTimer);flashTimer=null}
  $('flash').style.display='none';
}
/* la alerta se apaga sola a los 10 min por si nadie la para */
function alertaActiva(){return !!(alerta&&alerta.on&&alerta.ts&&(Date.now()-alerta.ts)<10*60*1000)}
function applyAlerta(){
  var on=alertaActiva();
  if(on&&!flashTimer&&alerta.ts!==flashDismissed)startFlash();
  if(!on&&flashTimer)stopFlash();
  applyMask();
}
/* tocar la pantalla la deja tranquila (solo esa alerta) */
$('flash').onclick=function(){flashDismissed=alerta?alerta.ts:0;stopFlash()};

/* ---- red ---- */
/* borra de la base de datos los mensajes con más de 30 min (si las reglas lo permiten) */
function borrar(id){
  if(borrados[id])return;borrados[id]=1;
  try{PC.xhr('DELETE',PC.url('mensajes/'+id),null,function(){})}catch(e){}
}
function pollMsgs(){
  if(!PC.configurado())return;
  PC.xhr('GET',PC.url('mensajes'),null,function(ok,j){
    if(!ok){fails++;renderEstado();return}
    fails=0;lastOk=Date.now();
    var list=[],k,mm;
    if(j&&typeof j==='object'){
      for(k in j)if(j.hasOwnProperty(k)&&j[k]&&j[k].texto){
        mm={id:k,de:j[k].de||'',texto:j[k].texto,ts:j[k].ts||Date.now()};
        if(vivo(mm))list.push(mm);else borrar(k);
      }
    }
    msgs=list;ls('pc_msgs',JSON.stringify(list));

  });
}
function pollAviso(){

  });
}
function pollAlerta(){

    if(!ok)return;

  });
}
function pollRec(){
  if(!PC.configurado())return;
  PC.xhr('GET',PC.url('recordatorio'),null,function(ok,j){
    if(!ok)return;

  });
}
function pollRutina(){
  if(!PC.configurado())return;
  PC.xhr('GET',PC.url('rutina'),null,function(ok,j){
    if(!ok)return;
    rutina=(j&&typeof j==='object')?j:null;ls('pc_rutina',JSON.stringify(rutina));renderAhora();
  });
  PC.xhr('GET',PC.url('festivos'),null,function(ok,j){

  });

/* ---- alarma de 5 segundos (botón "Sonar" de la web de familia) ---- */
var audioCtx=null,sonLast=null;
function getAudio(){
  try{
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return null;
    if(!audioCtx)audioCtx=new AC();
    if(audioCtx.state==='suspended'&&audioCtx.resume)audioCtx.resume();
    return audioCtx;
  }catch(e){return null}
}
function nota(ac,out,f,t,dur,vol){
  var o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(out);o.start(t);o.stop(t+dur+0.05);
}
function campana(ac,out,f,t,dur,vol){nota(ac,out,f,t,dur,vol);nota(ac,out,f*2.01,t,dur*0.6,vol*0.35);nota(ac,out,f*3.0,t,dur*0.3,vol*0.15)}
/* 3 notas descendentes (do-la-fa), grave y clara, 2 veces: ~5 s.
   Se reproduce con un <audio> normal (Chrome es más permisivo en apps instaladas); si falla, con Web Audio. */
var alarmaAudio=null;
function sintetizaWav(){
  var sr=22050,n=sr*5,d=new Float32Array(n),k,i,j;
  var notas=[];
  for(k=0;k<2;k++){var b=k*2.5;notas.push([523,b,0.9],[440,b+0.5,0.9],[349,b+1.0,1.5])}
  notas.forEach(function(x){
    var comps=[[x[0],x[2],0.7],[x[0]*2.01,x[2]*0.6,0.245],[x[0]*3,x[2]*0.3,0.105]];
    comps.forEach(function(c){
      var i0=Math.floor(x[1]*sr),len=Math.floor(c[1]*sr),w=2*Math.PI*c[0]/sr;
      for(i=0;i<len&&i0+i<n;i++){
        var t=i/sr,env=t<0.015?c[2]*(t/0.015):c[2]*Math.exp(Math.log(0.0001/c[2])*(t-0.015)/(c[1]-0.015));
        d[i0+i]+=env*Math.sin(w*i);
      }
    });
  });
  var buf=new ArrayBuffer(44+n*2),v=new DataView(buf);
  function str(o,t){for(var q=0;q<t.length;q++)v.setUint8(o+q,t.charCodeAt(q))}
  str(0,'RIFF');v.setUint32(4,36+n*2,true);str(8,'WAVE');str(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);str(36,'data');v.setUint32(40,n*2,true);
  for(j=0;j<n;j++){var y=d[j]*0.9;if(y>1)y=1;if(y<-1)y=-1;v.setInt16(44+j*2,y*32767,true)}
  return new Blob([buf],{type:'audio/wav'});
}
function preparaAudio(){
  try{alarmaAudio=new Audio(URL.createObjectURL(sintetizaWav()));alarmaAudio.preload='auto';alarmaAudio.volume=1}catch(e){alarmaAudio=null}
}
function alarmaWebAudio(){
  var ac=getAudio();if(!ac)return;
  try{
    var m=ac.createGain();m.gain.value=0.9;m.connect(ac.destination);
    var t=ac.currentTime+0.05,k,b;
    for(k=0;k<2;k++){b=t+k*2.5;campana(ac,m,523,b,0.9,0.7);campana(ac,m,440,b+0.5,0.9,0.7);campana(ac,m,349,b+1.0,1.5,0.7)}
  }catch(e){}
}
function alarma5(){
  if(alarmaAudio){
    try{
      alarmaAudio.currentTime=0;
      var pr=alarmaAudio.play();
      if(pr&&pr.catch)pr.catch(function(){alarmaWebAudio()});
      return;
    }catch(e){}
  }
  alarmaWebAudio();
}
preparaAudio();
function pollSonido(){
  if(!PC.configurado())return;
  PC.xhr('GET',PC.url('sonido'),null,function(ok,j){
    if(!ok)return;
    var ts=(j&&typeof j==='object'&&j.ts)?Number(j.ts):0;
    if(sonLast===null){var g=parseInt(ls('pc_sonido')||'0',10)||0;sonLast=g;if(!g){sonLast=ts;ls('pc_sonido',String(ts));return}}
    if(ts&&ts>sonLast){
      sonLast=ts;ls('pc_sonido',String(ts));
      if(Date.now()-ts<60000)alarma5();
    }
  });
}
document.addEventListener('touchstart',function(){getAudio()});

function pollAgenda(){

  PC.xhr('GET',PC.url('agenda'),null,function(ok,j){

    agenda={sem:j.sem,fest:j.fest||{}};ls('pc_agenda',JSON.stringify(agenda));renderAhora();
  });
}
function heartbeat(){
  if(!PC.configurado())return;
  function send(bat,chg){
    PC.xhr('PUT',PC.url('latido'),{ts:{'.sv':'timestamp'},bat:bat,cargando:chg,v:VERSION},function(){});
  }
  if(navigator.getBattery){
    navigator.getBattery().then(function(b){send(Math.round(b.level*100),!!b.charging)},function(){send(null,null)});
  }else send(null,null);
}

/* ---- reloj ---- */
function tick(){
  renderPop();
  var d=new Date(),key=PC.iso(d)+' '+d.getHours()+':'+d.getMinutes();
  if(key!==lastTick){
    lastTick=key;renderFecha();renderAhora();renderMsgs();
    /* recarga nocturna (coge versiones nuevas) */
    if(d.getHours()===3&&d.getMinutes()===30&&ls('pc_reload')!==PC.iso(d)&&navigator.onLine!==false){
      ls('pc_reload',PC.iso(d));location.reload();
    }
  }
}

window.addEventListener('resize',function(){setTimeout(layout,150)});
window.addEventListener('orientationchange',function(){setTimeout(layout,300)});
layout();
setInterval(tick,1000);
setInterval(renderEstado,5000);
setInterval(applyMask,5000);
/* la cuenta atrás y la barra se refrescan cada 20 s */
setInterval(renderAhora,20000);
pollAgenda();pollRutina();pollMsgs();pollAviso();pollAlerta();pollRec();heartbeat();
setInterval(function(){pollMsgs();pollAviso();pollAlerta();pollRec()},6000);
setInterval(pollAgenda,60000);setInterval(pollSonido,2500);pollSonido();setInterval(pollRutina,60000);
setInterval(heartbeat,60000);

/* pantalla encendida (si el navegador lo permite) */
function wake(){try{if(navigator.wakeLock&&navigator.wakeLock.request)navigator.wakeLock.request('screen').catch(function(){})}catch(e){}}
wake();document.addEventListener('visibilitychange',function(){if(!document.hidden)wake()});

if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
  try{navigator.serviceWorker.register('sw.js')}catch(e){}
}
window.PCpanel={agenda:function(){return agenda},render:render};
})();
