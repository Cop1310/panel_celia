<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1F4E79">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Panel de Celia</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Segoe UI",Roboto,Arial,sans-serif;-webkit-user-select:none;user-select:none}
body{background:#D8EDD5;color:#1B2A4A;-webkit-transition:background .6s;transition:background .6s}
body.noche{background:#3A0D0D;color:#FFE9D6}
#app{position:absolute;left:0;top:0;right:0;bottom:0}
.blk{position:absolute;overflow:hidden}
#dia{font-weight:800;text-align:center;line-height:1.05;white-space:nowrap}
#fl{font-weight:800;text-align:center;line-height:1.05;white-space:nowrap;color:#1B5E20}
body.noche #fl{color:#FFB74D}
#rec{text-align:center;line-height:1.1;font-weight:700;color:#8A3B00;white-space:nowrap;overflow:hidden}
body.noche #rec{color:#FFCC80}
#hm{font-weight:800;text-align:center;line-height:1;white-space:nowrap;color:#1B5E20}
body.noche #hm{color:#FFB74D}
#per{text-align:center;font-weight:700;line-height:1.1;color:#1B5E20;white-space:nowrap}
body.noche #per{color:#FFB74D}
#ahora{background:#EFF8EF;border:.6vmin solid #2E7D32;border-radius:3vmin;padding:1.2vmin 2vmin;text-align:center;display:block}
body.noche #ahora{background:#5A1414;border-color:#FFB74D}
#ahora.av{background:#FFF3E0;border-color:#C62828}
body.noche #ahora.av{background:#7A2020;border-color:#FFB74D}
#ahora .t0{font-weight:700;color:#46597F;line-height:1.1}
body.noche #ahora .t0{color:#FFCCA6}
#aico{line-height:1}
#atxt{font-weight:800;line-height:1.12;color:#12294F}
body.noche #atxt{color:#FFF}
#cuenta{font-weight:800;line-height:1.1;color:#1B5E20}
body.noche #cuenta{color:#FFB74D}
#barra{width:92%;margin-left:auto;margin-right:auto;border-radius:10px;background:#C8E6C9;overflow:hidden}
body.noche #barra{background:#7A2B2B}
#barraI{height:100%;width:0;background:#2E7D32;-webkit-transition:width 1s;transition:width 1s}
body.noche #barraI{background:#FFB74D}
#desp{color:#46597F;line-height:1.15}
body.noche #desp{color:#FFCCA6}
#chat{background:#FFFFFF;border:.5vmin solid #A5C7A8;border-radius:3vmin;padding:1.2vmin 1.6vmin}
body.noche #chat{background:#4A1212;border-color:#8E3B3B}
#chat .ct{font-weight:700;color:#46597F;line-height:1.2;margin-bottom:.6vmin}
body.noche #chat .ct{color:#FFCCA6}
#msgs{overflow:hidden}
.m{border-left:1.2vmin solid #2E7D32;background:#F1F8F1;border-radius:1.6vmin;padding:.8vmin 1.6vmin;margin-bottom:1vmin}
body.noche .m{background:#6A1B1B;border-left-color:#FFB74D}
.m.nuevo{background:#FFF59D;border-left-color:#E65100}
body.noche .m.nuevo{background:#FFB74D;color:#3E1010}
.m .de{font-weight:700;color:#46597F;line-height:1.2}
body.noche .m .de{color:#FFCCA6}
body.noche .m.nuevo .de{color:#5D2A10}
.m .tx{font-weight:700;line-height:1.15}
#estado{position:absolute;right:2vmin;bottom:1vmin;font-size:2.4vmin;color:#C62828;font-weight:700}
#mask{position:absolute;left:0;top:0;right:0;bottom:0;display:none;z-index:10;pointer-events:none;background:rgba(0,0,0,.45)}
#flash{position:absolute;left:0;top:0;right:0;bottom:0;display:none;z-index:20;text-align:center;padding:4vmin;cursor:pointer}
#flash.a{background:#FFD600;color:#1B2A4A}
#flash.b{background:#FFFFFF;color:#C62828}
#flash .fd{font-weight:800;line-height:1.1}
#flash .ft{font-weight:800;line-height:1.15;margin-top:2vmin}
#flash .fs{font-size:3vmin;margin-top:2vmin;opacity:.7}
</style>
</head>
<body class="dia">
<div id="app">
  <div class="blk" id="bdia"><div id="dia"></div><div id="fl"></div><div id="rec"></div></div>
  <div class="blk" id="bhora"><div id="hm"></div><div id="per"></div></div>
  <div class="blk" id="ahora"><div class="t0" id="t0">AHORA</div><div id="aico"></div><div id="atxt"></div><div id="cuenta"></div><div id="barra"><div id="barraI"></div></div><div id="desp"></div></div>
  <div class="blk" id="chat"><div class="ct" id="ct">Mensajes de tu familia</div><div id="msgs"></div><div id="estado"></div></div>
  <div id="mask"></div>
  <div id="flash"><div class="fd" id="fd"></div><div class="ft" id="ft"></div><div class="fs">Toca la pantalla para continuar</div></div>
</div>
<script src="firebase-config.js"></script>
<script src="comun.js"></script>
<script>
(function(){
var VERSION='1.2';
/* ---- ajustes fáciles de cambiar ---- */
var NOCHE_INI=22*60;          /* 22:00 empieza la noche */
var NOCHE_FIN=7*60+30;        /* 7:30 acaba la noche */
var MSG_VIDA=30*60*1000;      /* los mensajes duran 30 minutos */
var TOQUE_MIN=5;              /* minutos sin máscara tras tocar la pantalla */
var MSG_NUEVO_MIN=10;         /* minutos sin máscara tras un mensaje nuevo */
var MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

function $(id){return document.getElementById(id)}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
var agenda=null,msgs=[],lastOk=0,lastTick='',flashTimer=null,flashDismissed=0,aviso=null,alerta=null,fails=0,rec=null,maskOffUntil=0,borrados={};
try{agenda=JSON.parse(ls('pc_agenda')||'null')}catch(e){}
if(!agenda||!agenda.sem)agenda=PC.DEF();
try{msgs=JSON.parse(ls('pc_msgs')||'[]')}catch(e){msgs=[]}
try{aviso=JSON.parse(ls('pc_aviso')||'null')}catch(e){aviso=null}
try{rec=JSON.parse(ls('pc_rec')||'null')}catch(e){rec=null}

function place(id,x,y,w,h){var e=$(id);e.style.left=Math.round(x)+'px';e.style.top=Math.round(y)+'px';e.style.width=Math.round(w)+'px';e.style.height=Math.round(h)+'px'}
function setFs(id,px){$(id).style.fontSize=Math.round(px)+'px'}
function fitText(box,maxPx,minPx){
  var s=maxPx;box.style.fontSize=Math.round(s)+'px';
  while(box.scrollHeight>box.clientHeight+1&&s>minPx){s-=2;box.style.fontSize=Math.round(s)+'px'}
}
var L={};
function layout(){
  var W=window.innerWidth,H=window.innerHeight,land=W>H*1.1,m=Math.round(Math.min(W,H)*0.02);
  L.W=W;L.H=H;L.land=land;
  var bx,by,bw,bh,hx,hy,hw,hh,ax,ay,aw,ah,cx,cy,cw,ch;
  if(!land){
    bx=m;bw=W-2*m;hx=m;hw=bw;ax=m;aw=bw;cx=m;cw=bw;
    by=m;bh=H*0.20;hy=by+bh;hh=H*0.15;ay=hy+hh+m;ah=H*0.32;cy=ay+ah+m;ch=H-cy-m;
  }else{
    var lw=W*0.56;
    bx=m;bw=lw-m;hx=m;hw=bw;ax=m;aw=bw;
    by=m;bh=H*0.29;hy=by+bh;hh=H*0.24;ay=hy+hh+m;ah=H-ay-m;
    cx=lw+m;cw=W-cx-m;cy=m;ch=H-2*m;
  }
  place('bdia',bx,by,bw,bh);place('bhora',hx,hy,hw,hh);place('ahora',ax,ay,aw,ah);place('chat',cx,cy,cw,ch);
  /* día de la semana, fecha grande y línea de recordatorio */
  setFs('dia',Math.min(bh*0.27,bw*0.15));
  setFs('fl',Math.min(bh*0.36,bw*0.105));
  L.recFs=Math.min(bh*0.20,bw*0.06);
  $('rec').style.height=Math.round(bh*0.22)+'px';
  setFs('hm',Math.min(hh*0.70,hw*0.34));setFs('per',Math.min(hh*0.22,hw*0.07));
  render();
}
function esNoche(d){var mm=d.getHours()*60+d.getMinutes();return mm>=NOCHE_INI||mm<NOCHE_FIN}
function minOf(s){var p=String(s).split(':'),h=parseInt(p[0],10),mi=parseInt(p[1]||'0',10);if(isNaN(h)||isNaN(mi))return null;return h*60+mi}
function fmtDur(min){
  min=Math.ceil(min);
  if(min<1)return 'menos de 1 min';
  var h=Math.floor(min/60),mi=min%60;
  if(h===0)return mi+' min';
  if(mi===0)return h+' h';
  return h+' h '+mi+' min';
}
/* cuenta atrás hasta la próxima rutina + barra de progreso */
function renderCuenta(o,av,ah,aw){
  var c=$('cuenta'),b=$('barra'),bi=$('barraI'),nx=o.next,cur=o.cur;
  c.innerHTML='';b.style.display='none';
  if(av||!nx)return;
  var nm=minOf(nx.h);
  if(nm===null)return;
  var d=new Date(),now=d.getHours()*60+d.getMinutes()+d.getSeconds()/60;
  var target=nm+(o.manana?1440:0),rest=target-now;
  if(rest<0)rest+=1440;
  c.innerHTML=(rest<=1?'Falta ':'Faltan ')+fmtDur(rest);
  c.style.fontSize=Math.round(Math.min(ah*0.085,aw*0.048))+'px';
  var cm=cur?minOf(cur.h):null;
  if(cm===null)return;
  var start=cm;
  if(start>now)start-=1440;
  var total=target-start;
  if(total<=0)total+=1440;
  var p=(now-start)/total;
  if(p<0)p=0;if(p>1)p=1;
  b.style.display='block';
  b.style.height=Math.max(8,Math.round(ah*0.035))+'px';
  b.style.marginTop=Math.round(ah*0.01)+'px';b.style.marginBottom=Math.round(ah*0.01)+'px';
  bi.style.width=Math.round(p*100)+'%';
}
function renderAhora(){
  var d=new Date(),o=PC.ahora(agenda,d),cur=o.cur,nx=o.next;
  var av=(aviso&&aviso.texto)?aviso:null;
  document.body.className=esNoche(d)?'noche':'dia';
  $('ahora').className=av?'blk av':'blk';
  $('t0').innerHTML=av?'AVISO':'AHORA';
  var box=$('ahora'),ah=box.clientHeight,aw=box.clientWidth,land=L.land;
  $('t0').style.fontSize=Math.round(Math.min(ah*0.09,aw*0.045))+'px';
  $('aico').innerHTML=av?esc(av.icono||''):(cur&&cur.i?cur.i:'');
  $('aico').style.fontSize=Math.round(Math.min(ah*(land?0.20:0.17),aw*0.12))+'px';
  $('desp').innerHTML=(nx&&!av)?('Después, '+(PC.h12(parseInt(nx.h,10))===1?'a la ':'a las ')+PC.hmFull(nx.h)+(o.manana?' (mañana)':'')+': '+esc(nx.t)):'';
  $('desp').style.fontSize=Math.round(Math.min(ah*0.07,aw*0.036))+'px';
  renderCuenta(o,av,ah,aw);
  var extra=$('cuenta').offsetHeight+($('barra').style.display==='none'?0:$('barra').offsetHeight+Math.round(ah*0.02));
  var tx=$('atxt');tx.innerHTML=av?esc(av.texto):(cur?cur.t:'');
  var libre=ah-$('t0').offsetHeight-$('aico').offsetHeight-$('desp').offsetHeight-extra-Math.round(L.H*0.03)-6;
  var s=Math.min(ah*0.28,aw*0.12);tx.style.fontSize=Math.round(s)+'px';
  var g=0;while(tx.offsetHeight>libre&&s>14&&g++<80){s-=2;tx.style.fontSize=Math.round(s)+'px'}
  applyMask();
}
function renderFecha(){
  var d=new Date(),h=d.getHours();
  $('dia').innerHTML=PC.DIAS_C[d.getDay()];
  $('fl').innerHTML=d.getDate()+' de '+MESES[d.getMonth()];
  $('hm').innerHTML=PC.h12(h)+':'+PC.pad(d.getMinutes());
  $('per').innerHTML=PC.periodo(h);
}
/* línea que rellena la familia debajo de la fecha (ej. "Cumpleaños de Emma") */
function renderRec(){
  var e=$('rec');
  e.innerHTML=(rec&&rec.texto)?esc(rec.texto):'';
  var s=L.recFs||20;e.style.fontSize=Math.round(s)+'px';
  var g=0;while(e.scrollWidth>e.clientWidth+1&&s>14&&g++<60){s-=2;e.style.fontSize=Math.round(s)+'px'}
}
function quienDia(ts){
  var d=new Date(ts),n=new Date(),a=PC.iso(d),b=PC.iso(n);
  if(a===b)return '';
  var y=new Date(n.getFullYear(),n.getMonth(),n.getDate()-1,12,0);
  if(a===PC.iso(y))return 'ayer, ';
  return PC.DIAS[d.getDay()]+' '+d.getDate()+', ';
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function vivo(m){return (Date.now()-m.ts)<MSG_VIDA}
function renderMsgs(){
  var box=$('msgs'),W=L.W,H=L.H,ch=$('chat').clientHeight,cw=$('chat').clientWidth;
  var ct=$('ct');ct.style.fontSize=Math.round(Math.min(ch*0.06,cw*0.055))+'px';
  var avail=ch-ct.offsetHeight-Math.min(W,H)*0.05;
  box.style.height=Math.max(40,avail)+'px';
  if(!PC.configurado()){box.innerHTML='<div class="m"><div class="tx" style="font-size:'+Math.round(Math.min(W,H)*0.035)+'px;color:#78909C">Los mensajes aparecerán aquí.</div></div>';return}
  var L2=msgs.filter(vivo).sort(function(a,b){return b.ts-a.ts});
  if(!L2.length){box.innerHTML='<div class="m"><div class="tx" style="font-size:'+Math.round(Math.min(W,H)*0.04)+'px;color:#78909C">No hay mensajes nuevos.</div></div>';return}
  var base=Math.min(ch*0.11,cw*0.075),fs=base,out,k,n=Math.min(L2.length,8);
  function build(count,f){
    var h='',i,m,nuevo;
    for(i=0;i<count;i++){
      m=L2[i];nuevo=(Date.now()-m.ts)<10*60*1000;
      var d=new Date(m.ts),hh=PC.hm12(PC.pad(d.getHours())+':'+PC.pad(d.getMinutes()))+' '+PC.periodo(d.getHours());
      h+='<div class="m'+(nuevo?' nuevo':'')+'"><div class="de" style="font-size:'+Math.round(f*0.62)+'px">'+esc(m.de)+' · '+quienDia(m.ts)+hh+'</div><div class="tx" style="font-size:'+Math.round(f)+'px">'+esc(m.texto)+'</div></div>';
    }
    return h;
  }
  /* primero reducir letra, luego quitar los más antiguos */
  while(n>=1){
    fs=base;
    while(true){
      box.innerHTML=build(n,fs);
      if(box.scrollHeight<=box.clientHeight+1||fs<=Math.max(16,base*0.55))break;
      fs-=2;
    }
    if(box.scrollHeight<=box.clientHeight+1)break;
    n--;
  }
  if(n<1){box.innerHTML=build(1,Math.max(16,base*0.55))}
}
function renderEstado(){
  var e=$('estado');
  if(!PC.configurado()){e.innerHTML='';return}
  var down=(Date.now()-lastOk)>25000&&fails>=2;
  e.innerHTML=down?'Sin conexión':'';
  e.style.fontSize=Math.round(Math.min(L.W,L.H)*0.026)+'px';
}
function render(){renderFecha();renderRec();renderAhora();renderMsgs();renderEstado()}

/* ---- máscara de noche (brillo bajo simulado) ----
   Solo de 22:00 a 7:30. Se quita si hay mensaje nuevo, aviso, parpadeo,
   o durante unos minutos al tocar la pantalla. */
function hayMsgNuevo(){
  var i;
  for(i=0;i<msgs.length;i++)if((Date.now()-msgs[i].ts)<MSG_NUEVO_MIN*60*1000)return true;
  return false;
}
function applyMask(){
  var quitar=(Date.now()<maskOffUntil)||!!(aviso&&aviso.texto)||alertaActiva()||hayMsgNuevo();
  $('mask').style.display=(esNoche(new Date())&&!quitar)?'block':'none';
}
function toque(){maskOffUntil=Date.now()+TOQUE_MIN*60*1000;applyMask()}
document.addEventListener('touchstart',toque,false);
document.addEventListener('click',toque,false);

/* ---- parpadeo (solo cuando la familia lo activa) ---- */
function flashTexto(){
  var m=null,i;
  if(aviso&&aviso.texto)return {d:'Aviso de '+esc(aviso.de||''),t:esc(aviso.texto)};
  for(i=0;i<msgs.length;i++)if(!m||msgs[i].ts>m.ts)m=msgs[i];
  if(m&&(Date.now()-m.ts)<30*60*1000)return {d:'Mensaje de '+esc(m.de),t:esc(m.texto)};
  return {d:'',t:'Mira la pantalla'};
}
function startFlash(){
  var f=$('flash'),c=flashTexto();
  $('fd').innerHTML=c.d;$('ft').innerHTML=c.t;
  var u=Math.min(L.W,L.H);
  $('fd').style.fontSize=Math.round(u*0.07)+'px';
  var s=u*0.10;$('ft').style.fontSize=Math.round(s)+'px';
  f.style.display='block';f.className='a';
  var guard=0;while($('ft').scrollHeight+$('fd').offsetHeight>L.H*0.78&&s>18&&guard++<60){s-=3;$('ft').style.fontSize=Math.round(s)+'px'}
  if(flashTimer)clearInterval(flashTimer);
  var t=0;
  flashTimer=setInterval(function(){
    t++;f.className=(t%2)?'b':'a';
    if(!alertaActiva())stopFlash();
  },700);
}
function stopFlash(){
  if(flashTimer){clearInterval(flashTimer);flashTimer=null}
  $('flash').style.display='none';
}
/* la alerta se apaga sola a los 10 min por si nadie la para */
function alertaActiva(){return !!(alerta&&alerta.on&&alerta.ts&&(Date.now()-alerta.ts)<10*60*1000)}
function applyAlerta(){
  var on=alertaActiva();
  if(on&&!flashTimer&&alerta.ts!==flashDismissed)startFlash();
  if(!on&&flashTimer)stopFlash();
  applyMask();
}
/* tocar la pantalla la deja tranquila (solo esa alerta) */
$('flash').onclick=function(){flashDismissed=alerta?alerta.ts:0;stopFlash()};

/* ---- red ---- */
/* borra de la base de datos los mensajes con más de 30 min (si las reglas lo permiten) */
function borrar(id){
  if(borrados[id])return;borrados[id]=1;
  try{PC.xhr('DELETE',PC.url('mensajes/'+id),null,function(){})}catch(e){}
}
function pollMsgs(){
  if(!PC.configurado())return;
  PC.xhr('GET',PC.url('mensajes'),null,function(ok,j){
    if(!ok){fails++;renderEstado();return}
    fails=0;lastOk=Date.now();
    var list=[],k,mm;
    if(j&&typeof j==='object'){
      for(k in j)if(j.hasOwnProperty(k)&&j[k]&&j[k].texto){
        mm={id:k,de:j[k].de||'',texto:j[k].texto,ts:j[k].ts||Date.now()};
        if(vivo(mm))list.push(mm);else borrar(k);
      }
    }
    msgs=list;ls('pc_msgs',JSON.stringify(list));
    renderMsgs();renderEstado();applyMask();
  });
}
function pollAviso(){
  if(!PC.configurado())return;
  PC.xhr('GET',PC.url('aviso'),null,function(ok,j){
    if(!ok)return;
    aviso=(j&&typeof j==='object'&&j.texto)?j:null;
    ls('pc_aviso',JSON.stringify(aviso));renderAhora();
  });
}
function pollAlerta(){
  if(!PC.configurado())return;
  PC.xhr('GET',PC.url('alerta'),null,function(ok,j){
    if(!ok)return;
    alerta=(j&&typeof j==='object')?j:null;applyAlerta();
  });
}
function pollRec(){
  if(!PC.configurado())return;
  PC.xhr('GET',PC.url('recordatorio'),null,function(ok,j){
    if(!ok)return;
    rec=(j&&typeof j==='object'&&j.texto)?j:null;
    ls('pc_rec',JSON.stringify(rec));renderRec();
  });
}
function pollAgenda(){
  if(!PC.configurado())return;
  PC.xhr('GET',PC.url('agenda'),null,function(ok,j){
    if(!ok||!j||!j.sem)return;
    agenda={sem:j.sem,fest:j.fest||{}};ls('pc_agenda',JSON.stringify(agenda));renderAhora();
  });
}
function heartbeat(){
  if(!PC.configurado())return;
  function send(bat,chg){
    PC.xhr('PUT',PC.url('latido'),{ts:{'.sv':'timestamp'},bat:bat,cargando:chg,v:VERSION},function(){});
  }
  if(navigator.getBattery){
    navigator.getBattery().then(function(b){send(Math.round(b.level*100),!!b.charging)},function(){send(null,null)});
  }else send(null,null);
}

/* ---- reloj ---- */
function tick(){
  var d=new Date(),key=PC.iso(d)+' '+d.getHours()+':'+d.getMinutes();
  if(key!==lastTick){
    lastTick=key;renderFecha();renderAhora();renderMsgs();
    /* recarga nocturna (coge versiones nuevas) */
    if(d.getHours()===3&&d.getMinutes()===30&&ls('pc_reload')!==PC.iso(d)&&navigator.onLine!==false){
      ls('pc_reload',PC.iso(d));location.reload();
    }
  }
}

window.addEventListener('resize',function(){setTimeout(layout,150)});
window.addEventListener('orientationchange',function(){setTimeout(layout,300)});
layout();
setInterval(tick,1000);
setInterval(renderEstado,5000);
setInterval(applyMask,5000);
/* la cuenta atrás y la barra se refrescan cada 20 s */
setInterval(renderAhora,20000);
pollAgenda();pollMsgs();pollAviso();pollAlerta();pollRec();heartbeat();
setInterval(function(){pollMsgs();pollAviso();pollAlerta();pollRec()},6000);
setInterval(pollAgenda,60000);
setInterval(heartbeat,60000);

/* pantalla encendida (si el navegador lo permite) */
